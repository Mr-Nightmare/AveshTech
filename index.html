<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=public/index.html">
  <title>Avesh Technologies - Developer Root</title>
  <script>
    // Automatically redirect local file browsing to public storefront preserving tokens/hashes
    const targetUrl = "public/index.html" + window.location.search + window.location.hash;
    window.location.replace(targetUrl);
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 1rem; border: 1px solid #334155; text-align: center; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.5; }
    .btn { display: inline-block; background: #2563eb; color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; text-decoration: none; font-weight: 600; margin: 0.25rem; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Avesh Technologies</h1>
    <p>Redirecting to public storefront... If you are not redirected automatically, choose a portal below:</p>
    <div>
      <a href="public/index.html" class="btn">Enter Public Storefront</a>
      <a href="admin/index.html" class="btn btn-secondary">Admin Control Panel</a>
    </div>
  </div>
</body>
</html>
